onboarding = false

[terminal]
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+s"

[theme]
name = "terminal"

[theme.custom]
panel_bg = "reset"
accent = "#ffffff"
overlay0 = "#b4bfd6"
green = "#5eff6c"
blue = "#5ea1ff"
red = "#ff6e5e"
yellow = "#f1ff5e"

[ui]
sidebar_width = 30
sidebar_min_width = 18
sidebar_max_width = 36
sidebar_collapsed_mode = "compact"
mouse_capture = true
host_cursor = "native"
confirm_close = true
prompt_new_tab_name = false
pane_borders = false
pane_outer_borders = false
pane_gaps = true
hide_tab_bar_when_single_tab = true
accent = "#ffffff"

agent_panel_sort = "priority"
[ui.toast]
delivery = "terminal"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.toast.clipboard]
enabled = true
position = "bottom-center"

[ui.sound]
enabled = false

[ui.sidebar.agents]
row_gap = 1
rows = [
  ["state_icon", { token = "$repo", fg = "#8eb7e3", bold = true, dim = false }],
  [{ token = "$branch", fg = "#c2a9db", dim = false }],
  [{ token = "terminal_title_stripped", fg = "#ffffff", bold = true, dim = false }],
  [{ token = "agent", fg = "#b4bfd6", dim = false }],
]

[advanced]
scrollback_limit_bytes = 10485760

[experimental]
pane_history = false
allow_nested = false
kitty_graphics = false

[session]
resume_agents_on_restore = true
